name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run the suite
        run: pytest -q --junitxml=test-results.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    # The suite runs on SQLite by default because that is what a reviewer runs.
    # This job proves the same code passes on the backend a real deployment
    # would use - the storage layer is only portable if something checks.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: leadops
          POSTGRES_PASSWORD: leadops_ci_password
          POSTGRES_DB: leadops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Run the suite against PostgreSQL
        env:
          LEADOPS_TEST_DATABASE_URL: postgresql+asyncpg://leadops:leadops_ci_password@localhost:5432/leadops
        run: pytest -q

  demo:
    name: Demo script runs end to end
    runs-on: ubuntu-latest
    # The README tells a reviewer to run this. If it breaks, the README is a lie,
    # so CI runs it rather than trusting that it still works.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/demo.py

  workflow-json:
    name: n8n workflow is valid and regenerable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Regenerate and confirm nothing drifted
        run: |
          python scripts/build_workflow.py
          git diff --exit-code -- n8n/workflows/
      - run: pytest -q tests/unit/test_n8n_workflow.py

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan the tree for credentials
        run: python scripts/scan_secrets.py
      - name: Confirm the scanner actually fires
        # A scanner that can only ever pass is decorative. This plants a fake
        # credential, requires a non-zero exit, and removes it again.
        #
        # The probe is assembled from fragments at runtime rather than written as
        # a literal, because a literal here would be a real finding in this very
        # file - and the right response to that is to keep the scanner strict
        # rather than add an exception for it.
        run: |
          python -c "open('_ci_leak_probe.py','w').write('KEY = \"' + 'sk-' + 'ant-' + 'api03-' + 'AbCdEfGhIjKlMnOpQrStUvWxYz0123456789' + '\"\n')"
          if python scripts/scan_secrets.py; then
            echo "::error::scan_secrets.py did not detect a planted credential"
            rm -f _ci_leak_probe.py
            exit 1
          fi
          rm -f _ci_leak_probe.py
          echo "Scanner correctly rejected the planted credential."
